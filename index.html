<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameJia</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #10131b;
    color: white;
    font-family: Georgia, serif;
}

.game {
    max-width: 900px;
    min-height: 100vh;
    margin: auto;
    background: #202a35;
}

/* =========================
   AREA KARAKTER
========================= */

.scene {
    height: 62vh;
    min-height: 450px;
    position: relative;

    background:
        linear-gradient(
            rgba(30,40,50,.35),
            rgba(30,20,20,.7)
        ),
        url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8v030TA0WUbE089DB91BPuPZcedfr_JEeXIxQhNR-oA&s=10");

    background-size: cover;
    background-position: center;
}

/* GANTI URL GAMBAR JIA DI SINI */

.jia {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    max-height: 90%;
    max-width: 75%;

    object-fit: contain;

    filter: drop-shadow(0 8px 10px rgba(0,0,0,.5));
}


/* =========================
   STATUS
========================= */

.status {
    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    padding: 12px;

    background: rgba(0,0,0,.65);

    border-radius: 8px;

    font-family: Arial, sans-serif;
}


/* =========================
   DIALOG
========================= */

.dialog {
    position: absolute;

    left: 3%;
    right: 3%;
    bottom: 15px;

    padding: 15px;

    background: rgba(5,5,8,.92);

    border: 2px solid #a78358;

    border-radius: 8px;
}

.name {
    color: #ffd58c;

    font-weight: bold;

    margin-bottom: 8px;
}

.text {
    font-size: 20px;

    line-height: 1.45;

    min-height: 60px;
}


/* =========================
   INPUT PEMAIN
========================= */

.inputArea {
    padding: 12px;

    background: #11151d;
}

textarea {
    width: 100%;

    height: 75px;

    resize: none;

    padding: 10px;

    background: #080a0f;

    color: white;

    border: 1px solid #777;

    border-radius: 6px;

    font-family: Georgia, serif;

    font-size: 16px;
}

button {
    padding: 12px;

    background: #171b23;

    color: white;

    border: 1px solid #806c55;

    border-radius: 5px;

    cursor: pointer;

    font-weight: bold;
}

button:active {
    transform: scale(.97);
}

.mainButtons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 8px;
}


/* =========================
   PILIHAN DIALOG
========================= */

.choices {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    padding: 10px;

    background: #181c24;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .scene {
        min-height: 430px;
    }

    .jia {
        max-width: 90%;
        max-height: 80%;
    }

    .text {
        font-size: 17px;
    }

    .choices {
        grid-template-columns: 1fr;
    }
}
</style>
</head>


<body>

<div class="game">

    <div class="scene">

        <div class="status">

            ❤️ Affection:
            <span id="affection">50</span>

            &nbsp;&nbsp;

            🤝 Trust:
            <span id="trust">40</span>

        </div>


        <!--
        GANTI LINK DI BAWAH
        DENGAN LINK GAMBAR JIA LU
        -->

  <img
    id="jia"
    class="jia"
    src="Netral.png"
    alt="Jia"
>

        <div class="dialog">

            <div
                id="speaker"
                class="name"
            >
                Jia
            </div>

            <div
                id="dialogText"
                class="text"
            >
                Kamu datang juga...
                Aku sempat berpikir kamu tidak akan datang hari ini.
            </div>

        </div>

    </div>


    <!-- INPUT PEMAIN -->

    <div class="inputArea">

        <textarea
            id="playerInput"
            placeholder="Ketik apa pun yang ingin kamu katakan kepada Jia..."
        ></textarea>


        <div class="mainButtons">

            <button onclick="sendMessage()">
                💬 KIRIM
            </button>

            <button onclick="nextScene()">
                📖 LANJUT CERITA
            </button>

        </div>

    </div>


    <!-- PILIHAN OTOMATIS -->

    <div
        id="choices"
        class="choices"
    ></div>

</div>


<script>

/* =====================================================
   DATA GAME
===================================================== */

   Untuk sekarang boleh pakai gambar yang sama dulu.
*/

const JiaImages = {

/* STATUS */

let affection = 50;

let trust = 40;

let currentExpression = "normal";

let sceneNumber = 0;


/* =====================================================

===================================================== */

const playerChoices = {

        "Kita bisa melewati hari yang berat ini pelan-pelan.",

    ],

        "Kalau aku salah, bilang saja.",

        "Aku masih ingin memperbaiki keadaan.",

        "Aku lebih suka melihat kamu tersenyum.",

        "Kalau sudah tenang, boleh kita bicara lagi?"

    ],


    terkejut: [

        "Kamu kaget banget.",

        "Aku tidak bermaksud membuatmu terkejut.",

        "Aku cuma mengatakan apa yang sebenarnya kupikirkan.",

        "Aku penasaran apa yang ada di kepalamu sekarang.",

        "Tenang, aku tidak akan kabur.",

        "Reaksimu benar-benar tidak terduga."

    ]

};


/* =====================================================
   RESPONS JIA
===================================================== */


/*
   Banyak variasi supaya dialog tidak
   selalu mengulang kalimat yang sama.
*/

const JiaResponses = [

    {

        keywords: [
            "suka",
            "sayang",
            "cinta",
            "senang sama kamu"
        ],

        expressions: [
            "malu",
            "senang"
        ],

        responses: [

            "Kamu serius mengatakan itu? Jangan membuatku berharap kalau kamu tidak sungguh-sungguh.",

            "Aku tidak tahu harus menjawab apa... tapi aku senang mendengarnya.",

            "Kalau kamu terus bicara seperti itu, aku bisa benar-benar salah tingkah.",

            "Entah kenapa mendengar itu dari kamu terasa berbeda.",

            "Aku akan mengingat kata-kata itu. Jangan salahkan aku kalau nanti aku menagihnya."

        ]

    },


    {

        keywords: [
            "cantik",
            "indah",
            "manis",
            "lucu"
        ],

        expressions: [
            "malu",
            "senang"
        ],

        responses: [

            "Kamu masih saja memberi pujian mendadak seperti itu...",

            "Aku jadi tidak tahu harus melihat ke mana.",

            "Terima kasih... tapi jangan membuatku tersenyum terus.",

            "Kalau kamu memang serius, mungkin aku akan mulai percaya.",

            "Kamu sengaja membuatku malu, ya?"

        ]

    },


    {

        keywords: [
            "rindu",
            "kangen",
            "rindu kamu"
        ],

        expressions: [
            "malu",
            "sedih",
            "senang"
        ],

        responses: [

            "Kamu merindukanku? Aku kira cuma aku yang merasa begitu.",

            "Aneh ya... baru sebentar tidak bertemu, tapi rasanya lama sekali.",

            "Aku juga sempat berharap kamu datang lebih cepat.",

            "Jangan bilang begitu kalau kamu tidak siap membuatku tersenyum sepanjang hari.",

            "Mungkin aku memang juga sedikit merindukanmu."

        ]

    },


    {

        keywords: [
            "capek",
            "lelah",
            "cape"
        ],

        expressions: [
            "sedih",
            "senang"
        ],

        responses: [

            "Kalau begitu istirahat dulu. Kamu tidak harus selalu terlihat kuat.",

            "Hari ini berat, ya? Cerita saja. Aku dengarkan.",

            "Kalau ngobrol denganku bisa membuatmu sedikit lebih baik, aku akan menemanimu.",

            "Jangan terlalu memaksakan diri. Besok masih ada waktu.",

            "Aku harap setelah cerita sedikit, hatimu terasa lebih ringan."

        ]

    },


    {

        keywords: [
            "hai",
            "halo",
            "hei"
        ],

        expressions: [
            "senang",
            "malu"
        ],

        responses: [

            "Hai... akhirnya kamu datang juga.",

            "Aku sempat bertanya-tanya kapan kamu muncul.",

            "Hai. Entah kenapa aku langsung senang melihat pesanmu.",

            "Kamu datang tepat waktu. Aku memang sedang ingin ngobrol.",

            "Hai... jangan lihat aku begitu. Aku cuma senang kamu ada di sini."

        ]

    },


    {

        keywords: [
            "maaf",
            "sorry"
        ],

        expressions: [
            "sedih",
            "normal",
            "senang"
        ],

        responses: [

            "Tidak apa-apa. Aku menghargai kamu mau mengatakannya.",

            "Aku sudah tidak marah. Kita mulai lagi dari sini, ya?",

            "Terima kasih sudah kembali dan bicara baik-baik.",

            "Aku tidak ingin masalah kecil membuat kita saling menjauh."

        ]

    },


    {

        keywords: [
            "pergi",
            "dadah",
            "sampai jumpa"
        ],

        expressions: [
            "sedih",
            "malu"
        ],

        responses: [

            "Baik... hati-hati. Jangan lupa kembali.",

            "Sampai besok. Jangan membuatku menunggu terlalu lama.",

            "Aku tidak akan menahanmu... tapi cepat kembali, ya.",

            "Hati-hati. Aku masih punya banyak cerita untukmu.",

            "Sampai jumpa. Rasanya percakapan kita selalu berakhir terlalu cepat."

        ]

    }

];


/* =====================================================
   RESPONS UMUM
===================================================== */

const genericResponses = [

    "Hmm... aku suka cara kamu memikirkan hal itu. Ceritakan lebih banyak.",

    "Aku tidak pernah melihatnya dari sisi itu.",

    "Menarik... ternyata ada banyak hal yang belum aku tahu tentang kamu.",

    "Aku suka saat kamu bicara jujur seperti ini.",

    "Entah kenapa, ngobrol denganmu membuat waktu terasa cepat.",

    "Aku ingin mendengar bagian lainnya.",

    "Kamu selalu punya cara sendiri untuk membuat percakapan jadi menarik.",

    "Aku tidak menyangka jawabanmu akan seperti itu.",

    "Mungkin kita memang punya lebih banyak kesamaan daripada yang kukira.",

    "Kalau kamu terus cerita seperti ini, aku bisa lupa waktu.",

    "Aku senang kamu mau menceritakannya kepadaku.",

    "Hmm... aku akan mengingat jawabanmu.",

    "Ada sesuatu dari cara kamu bercerita yang membuatku ingin terus mendengarkan.",

    "Jangan berhenti cerita. Aku masih ingin tahu.",

    "Aku mulai penasaran dengan sisi lain dari dirimu."

];


/* =====================================================
   FUNGSI
===================================================== */

function random(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* GANTI EKSPRESI */

function setExpression(expression) {

    currentExpression = expression;

    const image =
        document.getElementById("jia");

    image.src =
        JiaImages[expression];

}


/* TAMPILKAN DIALOG */

function showDialog(
    speaker,
    message
) {

    document.getElementById(
        "speaker"
    ).textContent = speaker;

    document.getElementById(
        "dialogText"
    ).textContent = message;

}


/* BUAT PILIHAN BARU */

function generateChoices() {

    const container =
        document.getElementById("choices");

    container.innerHTML = "";

    let pool =
        playerChoices[currentExpression];

    /*
       Acak pilihan.
    */

    pool =
        [...pool].sort(
            () => Math.random() - .5
        );


    /*
       Ambil 4 berbeda.
    */

    pool.slice(0,4).forEach(
        function(message) {

            const button =
                document.createElement("button");

            button.textContent =
                message;

            button.onclick =
                function() {

                    document.getElementById(
                        "playerInput"
                    ).value = message;

                    sendMessage();

                };

            container.appendChild(button);

        }
    );

}


/* PEMAIN MENGIRIM PESAN */

function sendMessage() {

    const input =
        document.getElementById(
            "playerInput"
        );

    const message =
        input.value.trim();


    if(!message) return;


    showDialog(
        "Kamu",
        message
    );


    input.value = "";


    /*
       Jia menjawab sedikit kemudian.
    */

    setTimeout(
        function() {

            answerJia(message);

        },
        650
    );

}


/* JIA MENJAWAB */

function answerJia(message) {

    const lower =
        message.toLowerCase();


    let matched = null;


    /*
       Cari topik yang cocok.
    */

    for(
        const data of JiaResponses
    ) {

        for(
            const keyword of data.keywords
        ) {

            if(
                lower.includes(keyword)
            ) {

                matched = data;

                break;

            }

        }


        if(matched) break;

    }


    let response;


    if(matched) {

        response =
            random(
                matched.responses
            );


        setExpression(
            random(
                matched.expressions
            )
        );


        affection += 3;

        trust += 2;

    }

    else {

        response =
            random(
                genericResponses
            );


        /*
           Ekspresi random ringan.
        */

        const expressions = [
            "normal",
            "senang",
            "malu"
        ];


        setExpression(
            random(expressions)
        );


        trust += 1;

    }


    showDialog(
        "Jia",
        response
    );


    updateStatus();

    /*
       PILIHAN PEMAIN BERUBAH LAGI
    */

    generateChoices();

}


/* STATUS */

function updateStatus() {

    affection =
        Math.max(
            0,
            Math.min(
                100,
                affection
            )
        );


    trust =
        Math.max(
            0,
            Math.min(
                100,
                trust
            )
        );


    document.getElementById(
        "affection"
    ).textContent = affection;


    document.getElementById(
        "trust"
    ).textContent = trust;

}


/* SCENE BARU */

const scenes = [

    [
        "senang",
        "Aku senang kamu datang lagi. Tadi aku sempat berpikir... apa hari ini kamu akan datang mencariku."
    ],

    [
        "malu",
        "Aku tidak tahu sejak kapan, tapi sekarang aku mulai menantikan saat kita bisa ngobrol seperti ini."
    ],

    [
        "terkejut",
        "Eh? Kamu datang lebih cepat. Aku bahkan belum sempat menyembunyikan senyumku."
    ],

    [
        "normal",
        "Ada sesuatu tentang percakapan kita yang membuatku ingin mengenalmu lebih jauh."
    ],

    [
        "senang",
        "Kalau besok kamu tidak datang, mungkin hariku akan terasa sedikit lebih sepi."
    ],

    [
        "malu",
        "Jangan terlalu sering membuatku nyaman begini... nanti aku malah terbiasa menunggumu."
    ],

    [
        "sedih",
        "Waktu bersama kamu selalu terasa terlalu singkat."
    ],

    [
        "senang",
        "Kalau boleh jujur, aku mulai menyukai sore-sore seperti ini."
    ],

    [
        "malu",
        "Kamu tahu? Ada beberapa hal yang cuma ingin kuceritakan kepadamu."
    ],

    [
        "senang",
        "Mungkin hal sederhana seperti duduk dan ngobrol begini memang cukup membuat hari jadi lebih baik."
    ]

];


function nextScene() {

    sceneNumber++;

    const scene =
        scenes[
            sceneNumber %
            scenes.length
        ];


    setExpression(
        scene[0]
    );


    showDialog(
        "Jia",
        scene[1]
    );


    generateChoices();

}


/* MULAI */

generateChoices();

updateStatus();

</script>

</body>
</html>
